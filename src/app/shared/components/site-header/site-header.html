<header class="header">
  <div class="header__inner container">
    <a class="header__brand" routerLink="/">
      <span class="header__logo" aria-hidden="true">B</span>
      <span class="header__name">Batumi Top 10</span>
    </a>

    @if (breadcrumb()) {
      <nav class="header__breadcrumb" aria-label="Breadcrumb">
        <a class="header__breadcrumb-link" routerLink="/">Top 10 List</a>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m9 6 6 6-6 6" />
        </svg>
        <span class="header__breadcrumb-current" aria-current="page">{{ breadcrumb() }}</span>
      </nav>
    }

    <div class="header__actions">
      <app-language-switcher />
      <app-button variant="whatsapp" size="sm" [href]="whatsappUrl">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18a8 8 0 0 1-4.1-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8 8 0 1 1 12 20Zm4.4-6c-.2-.1-1.4-.7-1.6-.8-.2-.1-.4-.1-.6.1-.2.2-.6.8-.8 1-.1.2-.3.2-.5.1a6.5 6.5 0 0 1-3.2-2.8c-.2-.4.2-.4.6-1.2 0-.2 0-.3-.1-.4l-.7-1.8c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5 0-.7.3a3 3 0 0 0-1 2.2c0 1.3 1 2.6 1.1 2.8.1.2 2 3 4.8 4.2 1.8.8 2.5.8 3.4.7.5-.1 1.4-.6 1.6-1.2.2-.6.2-1.1.1-1.2 0-.1-.2-.2-.4-.3Z" />
        </svg>
        WhatsApp
      </app-button>
    </div>
  </div>
</header>
