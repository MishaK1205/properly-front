<header class="header">
  <div class="header__inner container">
    <a class="header__brand" routerLink="/">
      <span class="header__logo" aria-hidden="true">B</span>
      <span class="header__name">Batumi Top 10</span>
    </a>

    <div class="header__actions">
      <app-language-switcher />
      <app-button-link variant="whatsapp" size="sm" [href]="whatsappUrl">
        <app-whatsapp-icon [size]="16" />
        WhatsApp
      </app-button-link>
    </div>
  </div>
</header>
