<div class="field">
  <label class="field__label" [for]="id">{{ label() }}</label>
  <div class="field__wrap">
    <select
      class="field__control"
      [class.field__control--empty]="!value()"
      [id]="id"
      [required]="required()"
      [value]="value()"
      (change)="onChange($event)"
    >
      @if (placeholder()) {
        <option value="" disabled [selected]="!value()">{{ placeholder() }}</option>
      }
      @for (option of options(); track option) {
        <option [value]="option" [selected]="value() === option">{{ option }}</option>
      }
    </select>
    <svg class="field__chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="m6 9 6 6 6-6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </div>
  @if (hint()) {
    <p class="field__hint">{{ hint() }}</p>
  }
</div>
