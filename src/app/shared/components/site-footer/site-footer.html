<footer class="footer">
  <div class="footer__top container">
    <div class="footer__brand">
      <p class="footer__logo-row">
        <span class="footer__logo" aria-hidden="true">B</span>
        <span class="footer__name">Batumi Top 10</span>
      </p>
      <p class="footer__tagline">Independent investment research. Free for buyers.</p>
    </div>

    <nav class="footer__nav" aria-label="Footer">
      @for (link of links; track link) {
        <a class="footer__link" href="#">{{ link }}</a>
      }
    </nav>

    <div class="footer__actions">
      <a class="footer__social footer__social--whatsapp" [href]="whatsappUrl" target="_blank" rel="noopener" aria-label="WhatsApp">
        <app-whatsapp-icon [size]="16" />
      </a>
      <a class="footer__social footer__social--telegram" [href]="telegramUrl" target="_blank" rel="noopener" aria-label="Telegram">
        <app-telegram-icon [size]="16" />
      </a>
      <app-language-switcher appearance="dark" />
    </div>
  </div>

  <div class="footer__bottom">
    <p class="footer__legal container">
      © {{ year }} · Independent editorial · Not affiliated with any single developer · Free for buyers
    </p>
  </div>
</footer>
