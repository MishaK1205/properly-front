<section class="verify">
  <div class="verify__grid container">
    <div class="verify__content" appScrollReveal>
      <h2 class="verify__title">How we verify every property on this list</h2>

      <ul class="verify__list">
        @for (check of checks; track check) {
          <li class="verify__item">
            <span class="verify__check" aria-hidden="true">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <path d="m4 12 5 5L20 7" />
              </svg>
            </span>
            {{ check }}
          </li>
        }
      </ul>

      <p class="verify__note">{{ note }}</p>
    </div>

    <app-agent-card [appScrollReveal]="150" [agent]="agent" />
  </div>
</section>
