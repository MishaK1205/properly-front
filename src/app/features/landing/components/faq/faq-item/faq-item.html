<div class="item" [class.item--open]="expanded()">
  <button
    type="button"
    class="item__question"
    [attr.aria-expanded]="expanded()"
    (click)="toggled.emit()"
  >
    {{ question() }}
    <svg
      class="item__chevron"
      width="14"
      height="14"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="m6 9 6 6 6-6" />
    </svg>
  </button>

  <div class="item__panel" [attr.aria-hidden]="!expanded()" [inert]="!expanded()">
    <div class="item__panel-inner">
      <p class="item__answer">{{ answer() }}</p>
    </div>
  </div>
</div>
