<section class="process">
  <div class="container">
    <app-section-heading eyebrow="The Process" title="How this works for you as a buyer" />

    <ol class="process__steps">
      @for (step of steps; track step.title; let last = $last) {
        <li class="process__step">
          <span class="process__icon" aria-hidden="true">
            @switch (step.icon) {
              @case ('search') {
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                  <circle cx="11" cy="11" r="7" />
                  <path d="m21 21-4.3-4.3" />
                </svg>
              }
              @case ('clipboard') {
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="5" y="4" width="14" height="18" rx="2" />
                  <path d="M9 2h6v4H9zM9 11h6M9 15h6" />
                </svg>
              }
              @case ('chat') {
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 12a8 8 0 0 1-8 8H4l2-3a8 8 0 1 1 15-5Z" />
                </svg>
              }
            }
          </span>
          <h3 class="process__title">{{ step.title }}</h3>
          <p class="process__description">{{ step.description }}</p>
          @if (!last) {
            <span class="process__arrow" aria-hidden="true">›</span>
          }
        </li>
      }
    </ol>

    <p class="process__note">{{ note }}</p>
  </div>
</section>
