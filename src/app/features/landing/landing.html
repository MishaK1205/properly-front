<app-announcement-bar (briefRequested)="scrollTo('contact')" />
<app-site-header />

<main>
  <app-hero
    (briefRequested)="scrollTo('contact')"
    (shortlistRequested)="scrollTo('shortlist')"
  />
  <app-market-case />
  <app-shortlist id="shortlist" [properties]="properties" (interested)="onInterested($event)" />
  <app-how-it-works />
  <app-verification />
  <app-faq />
  <app-lead-form
    id="contact"
    [propertyNames]="propertyNames()"
    [preselectedProperty]="selectedProperty()"
  />
</main>

<app-site-footer />

<a
  class="whatsapp-fab"
  [href]="whatsappUrl"
  target="_blank"
  rel="noopener"
  aria-label="Chat with us on WhatsApp"
>

  </svg>
</a>
