<app-scroll-progress />
<app-announcement-bar (briefRequested)="scrollTo('contact')" />
<app-site-header />

<main class="page">
  <app-hero
    (briefRequested)="scrollTo('contact')"
    (shortlistRequested)="scrollTo('shortlist')"
  />
  <app-market-case />
  <app-shortlist
    id="shortlist"
    [projects]="projects()"
    [loading]="loading()"
    [failed]="failed()"
    (interested)="onInterested($event)"
    (retry)="loadProjects()"
  />
  <app-how-it-works />
  <app-verification />
  <app-faq />
  <app-lead-form
    id="contact"
    [propertyNames]="projectNames()"
    [preselectedProperty]="selectedProject()"
  />
</main>

<app-site-footer />

<a
  class="whatsapp-fab"
  [href]="whatsappUrl"
  target="_blank"
  rel="noopener"
  aria-label="Chat with us on WhatsApp"
>
  <app-whatsapp-icon [size]="26" />
</a>
