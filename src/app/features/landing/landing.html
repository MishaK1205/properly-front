<app-site-header />

<main class="page">
  <app-hero
    (briefRequested)="scrollTo('contact')"
    (shortlistRequested)="scrollTo('shortlist')"
  />
  <app-market-case />
  <app-shortlist
    id="shortlist"
    [projects]="projects()"
    [loading]="loading()"
    [failed]="failed()"
    (interested)="onInterested($event)"
    (retry)="loadProjects()"
  />
  <app-how-it-works />
  <app-verification />
  <app-faq />
  <app-lead-form
    id="contact"
    [propertyNames]="projectNames()"
    [preselectedProperty]="selectedProject()"
  />
</main>

<app-site-footer />

<app-whatsapp-fab [href]="whatsappUrl" />
