<section class="explore">
  <div class="container">
    <app-section-heading
      appScrollReveal
      align="start"
      eyebrow="Keep Exploring"
      title="Other verified investments you might like"
    />

    <div class="explore__grid">
      @for (card of cards(); track card.id; let i = $index) {
        <a class="explore__card" [appScrollReveal]="i * 100" [routerLink]="['/property', card.id]">
          <div class="explore__media">
            @if (card.imageUrl; as imageUrl) {
              <img [src]="imageUrl" [alt]="card.name" loading="lazy" decoding="async" />
            } @else {
              <div class="explore__placeholder" aria-hidden="true">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <path d="M3 21V7l9-4 9 4v14h-7v-6h-4v6H3Z" />
                </svg>
              </div>
            }
          </div>

          <div class="explore__body">
            <h3 class="explore__name">{{ card.name }}</h3>
            <div class="explore__row">
              <span class="explore__location">{{ card.location }}</span>
              <span class="explore__view">View →</span>
            </div>
          </div>
        </a>
      }
    </div>

    <p class="explore__back">
      <a class="explore__back-link" routerLink="/">← Back to the full Top 10 list</a>
    </p>
  </div>
</section>
