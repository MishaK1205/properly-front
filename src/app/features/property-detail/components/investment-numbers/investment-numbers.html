@if (detail().numbers.stats.length) {
  <section class="numbers">
    <div class="container">
      <app-section-heading
        appScrollReveal
        align="start"
        eyebrow="The Numbers"
        title="Investment breakdown at a glance"
      />

      <div class="numbers__grid">
        @for (stat of detail().numbers.stats; track stat; let i = $index) {
          <article
            class="numbers__card rich-text rich-text--stat"
            [appScrollReveal]="(i % 3) * 90"
            [innerHTML]="stat | safeHtml"
          ></article>
        }
      </div>

      <p class="numbers__disclaimer">{{ detail().numbers.disclaimer }}</p>
    </div>
  </section>
}
