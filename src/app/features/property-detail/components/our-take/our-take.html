<section class="take">
  <div class="take__grid container">
    <article class="take__content" appScrollReveal>
      <p class="take__eyebrow">Our Take</p>

      @if (detail().description; as description) {
        <div class="take__body rich-text rich-text--lead" [innerHTML]="description | safeHtml"></div>
      }
    </article>

    @if (detail().verification.checks.length) {
      <aside class="take__checklist" [appScrollReveal]="150">
        <h3 class="take__checklist-title">Verification checklist</h3>

        <ul class="take__checks">
          @for (check of detail().verification.checks; track check) {
            <li class="take__check">
              <span class="take__check-icon" aria-hidden="true">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                  <path d="m4 12 5 5L20 7" />
                </svg>
              </span>
              {{ check }}
            </li>
          }
        </ul>
      </aside>
    }
  </div>
</section>
