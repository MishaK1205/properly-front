<div
  class="slider"
  role="region"
  aria-roledescription="carousel"
  [attr.aria-label]="label()"
  [attr.tabindex]="hasMany() ? 0 : null"
  (keydown.arrowleft)="previous()"
  (keydown.arrowright)="next()"
  (pointerdown)="onPointerDown($event)"
  (pointerup)="onPointerUp($event)"
  (pointercancel)="onPointerCancel()"
>
  <div class="slider__viewport">
    <div class="slider__track" [style.translate]="'-' + index() * 100 + '% 0'">
      @for (url of images(); track $index; let i = $index) {
        <div class="slider__slide" [attr.aria-hidden]="i !== index()">
          <img
            class="slider__image"
            [src]="url"
            [alt]="i === index() ? label() + ' ' + (i + 1) : ''"
            loading="lazy"
            decoding="async"
            draggable="false"
          />
        </div>
      }
    </div>

    @if (hasMany()) {
      <button type="button" class="slider__arrow slider__arrow--prev" (click)="previous()" aria-label="Previous plan">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m15 6-6 6 6 6" />
        </svg>
      </button>
      <button type="button" class="slider__arrow slider__arrow--next" (click)="next()" aria-label="Next plan">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m9 6 6 6-6 6" />
        </svg>
      </button>

      <p class="slider__counter" aria-live="polite">{{ index() + 1 }} / {{ count() }}</p>
    }
  </div>

  @if (hasMany()) {
    <div class="slider__dots" role="tablist" aria-label="Choose a plan">
      @for (url of images(); track $index; let i = $index) {
        <button
          type="button"
          role="tab"
          class="slider__dot"
          [class.slider__dot--active]="i === index()"
          [attr.aria-selected]="i === index()"
          [attr.aria-label]="'Plan ' + (i + 1) + ' of ' + count()"
          (click)="select(i)"
        ></button>
      }
    </div>
  }
</div>
