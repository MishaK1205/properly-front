<dialog
  #dialog
  class="lightbox"
  [attr.aria-label]="name() + ' photos'"
  (close)="close()"
  (click)="onBackdropClick($event)"
  (keydown.arrowleft)="previous()"
  (keydown.arrowright)="next()"
>
  <header class="lightbox__bar">
    <p class="lightbox__title">{{ name() }}</p>
    <p class="lightbox__counter" aria-live="polite">{{ index() + 1 }} / {{ count() }}</p>
    <button type="button" class="lightbox__close" (click)="close()" aria-label="Close fullscreen photos">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
        <path d="M6 6l12 12M18 6 6 18" />
      </svg>
    </button>
  </header>

  <div class="lightbox__stage">
    @for (url of images(); track $index; let i = $index) {
      <img
        class="lightbox__photo"
        [class.lightbox__photo--active]="i === index()"
        [src]="url"
        [alt]="i === index() ? name() + ' — photo ' + (i + 1) : ''"
        [attr.aria-hidden]="i !== index()"
        decoding="async"
        draggable="false"
      />
    }

    @if (count() > 1) {
      <button type="button" class="lightbox__arrow lightbox__arrow--prev" (click)="previous()" aria-label="Previous photo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m15 6-6 6 6 6" />
        </svg>
      </button>
      <button type="button" class="lightbox__arrow lightbox__arrow--next" (click)="next()" aria-label="Next photo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m9 6 6 6-6 6" />
        </svg>
      </button>
    }
  </div>

  @if (count() > 1) {
    <div class="lightbox__thumbs" role="tablist" aria-label="Choose a photo">
      @for (url of images(); track $index; let i = $index) {
        <button
          type="button"
          role="tab"
          class="lightbox__thumb"
          [class.lightbox__thumb--active]="i === index()"
          [attr.aria-selected]="i === index()"
          [attr.aria-label]="'Photo ' + (i + 1) + ' of ' + count()"
          (click)="index.set(i)"
        >
          <img [src]="url" alt="" loading="lazy" decoding="async" draggable="false" />
        </button>
      }
    </div>
  }
</dialog>
