@if (property(); as property) {
  <app-site-header [breadcrumb]="property.name" />

  <main>
    <app-detail-hero [property]="property" [detail]="detail()!" (interested)="scrollTo('contact')" />
    <app-our-take [detail]="detail()!" />
    <app-investment-numbers [detail]="detail()!" />
    <app-property-tabs
      [property]="property"
      [detail]="detail()!"
      (paymentDetailsRequested)="scrollTo('contact')"
    />
    <app-developer-section [detail]="detail()!" />
    <app-interest-form id="contact" [propertyName]="property.name" />
    <app-keep-exploring [properties]="related()" />
  </main>

  <app-site-footer />

  <a
    class="whatsapp-fab"
    [href]="whatsappUrl"
    target="_blank"
    rel="noopener"
    aria-label="Chat with us on WhatsApp"
  >
    <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18a8 8 0 0 1-4.1-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8 8 0 1 1 12 20Zm4.4-6c-.2-.1-1.4-.7-1.6-.8-.2-.1-.4-.1-.6.1-.2.2-.6.8-.8 1-.1.2-.3.2-.5.1a6.5 6.5 0 0 1-3.2-2.8c-.2-.4.2-.4.6-1.2 0-.2 0-.3-.1-.4l-.7-1.8c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5 0-.7.3a3 3 0 0 0-1 2.2c0 1.3 1 2.6 1.1 2.8.1.2 2 3 4.8 4.2 1.8.8 2.5.8 3.4.7.5-.1 1.4-.6 1.6-1.2.2-.6.2-1.1.1-1.2 0-.1-.2-.2-.4-.3Z" />
    </svg>
  </a>
} @else {
  <app-site-header />

  <main class="not-found container">
    <h1 class="not-found__title">Property not found</h1>
    <p class="not-found__text">This property is no longer on our shortlist.</p>
    <a class="not-found__link" routerLink="/">← Back to the full Top 10 list</a>
  </main>

  <app-site-footer />
}
