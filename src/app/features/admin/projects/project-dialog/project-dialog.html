<h2 mat-dialog-title>{{ project ? 'Edit project' : 'Add project' }}</h2>

<mat-dialog-content class="project-dialog__content">
  <form [formGroup]="form" id="project-form" class="project-form" (ngSubmit)="save()">
    <p class="project-form__hint">
      Panels follow the property page from top to bottom, so each one fills in one section of it.
    </p>

    <mat-accordion multi>
      <app-hero-section [form]="form" [expandAll]="expandAll()" [(images)]="projectImages" />

      <app-our-take-section [form]="form" [expandAll]="expandAll()" />

      <app-numbers-section [form]="form" [expandAll]="expandAll()" />

      <app-overview-section [form]="form" [expandAll]="expandAll()" />

      <app-floor-plans-section
        [form]="form"
        [expandAll]="expandAll()"
        [(images)]="floorPlanImages"
      />

      <app-payment-plan-section [form]="form" [expandAll]="expandAll()" />
    </mat-accordion>

    @if (saveError(); as message) {
      <p class="project-form__error" role="alert">
        <mat-icon aria-hidden="true">error_outline</mat-icon>
        {{ message }}
      </p>
    }
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button matButton mat-dialog-close [disabled]="saving()">Cancel</button>
  <button matButton="filled" type="submit" form="project-form" [disabled]="saving()">
    @if (saving()) {
      <mat-spinner diameter="18" />
    } @else {
      {{ project ? 'Save changes' : 'Create project' }}
    }
  </button>
</mat-dialog-actions>
