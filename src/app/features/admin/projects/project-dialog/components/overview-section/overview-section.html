<div class="project-form__stack">
  <app-field-group
    label="Building"
    translated
    help="The first rows of the Overview tab, in page order: building type, finishing, furniture package and STR management. The photo beside the rows is the first gallery image."
  >
    <div class="project-form__grid">
      <app-translated-field [group]="form()" base="buildingType" label="Building type" />
      <app-translated-field [group]="form()" base="finishing" label="Finishing" />
      <app-translated-field [group]="form()" base="furniturePackage" label="Furniture package" />
      <app-translated-field
        [group]="form()"
        base="strManagementOnSite"
        label="STR management on site"
      />
    </div>
  </app-field-group>

  <app-field-group
    label="Size & distances"
    help="The remaining Overview rows. They read the same in every language, so they are entered once."
  >
    <div class="project-form__grid" [formGroup]="form()">
      <mat-form-field appearance="outline">
        <mat-label>Total floors</mat-label>
        <input matInput type="number" min="0" formControlName="totalFloors" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Units in building</mat-label>
        <input matInput type="number" min="0" formControlName="unitsInBuilding" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Unit sizes available</mat-label>
        <input matInput formControlName="unitSizesAvailable" placeholder="e.g. 28–75 m²" />
        <mat-error>Required</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Distance to sea</mat-label>
        <input matInput formControlName="distanceToSea" placeholder="e.g. 250 m" />
        <mat-error>Required</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Distance to city center</mat-label>
        <input matInput formControlName="distanceToCityCenter" placeholder="e.g. 2 km" />
        <mat-error>Required</mat-error>
      </mat-form-field>
    </div>
  </app-field-group>
</div>
