<div class="language-switcher" role="group" aria-label="Language being edited">
  @for (option of options(); track option.suffix) {
    <button
      type="button"
      class="language-switcher__option"
      [class.language-switcher__option--active]="option.active"
      [attr.aria-pressed]="option.active"
      [matTooltip]="
        option.missing ? option.label + ' — required fields still empty' : option.label
      "
      (click)="select(option.suffix)"
    >
      {{ option.code }}
      @if (option.missing) {
        <mat-icon class="language-switcher__flag" aria-label="Missing required fields">
          error
        </mat-icon>
      }
    </button>
  }
</div>
