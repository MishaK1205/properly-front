<div class="project-form__stack">
  <app-field-group
    label="Gallery"
    help="The photo gallery on the left of the hero. The first image is the main photo and also the cover on the home page; the rest become thumbnails under it."
  >
    <app-image-uploader label="Project images" [(imageIds)]="images" />
  </app-field-group>

  <app-field-group
    label="Name & developer"
    help="The title of the summary card. The company also fills the “The Developer” section at the bottom of the page."
  >
    <div class="project-form__grid" [formGroup]="form()">
      <mat-form-field appearance="outline">
        <mat-label>Project name</mat-label>
        <input matInput formControlName="projectName" />
        <mat-error>Required</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Company</mat-label>
        <mat-select formControlName="company">
          @for (company of companies(); track company._id) {
            <mat-option [value]="company._id">{{ company.companyName }}</mat-option>
          }
        </mat-select>
        <mat-error>Required</mat-error>
      </mat-form-field>
    </div>
  </app-field-group>

  <app-field-group
    label="Location"
    translated
    help="Shown under the company name. Clicking it opens Google Maps at the coordinates below, which are the same in every language."
  >
    <div class="project-form__grid" [formGroup]="form()">
      <app-translated-field
        class="project-form__span-2"
        [group]="form()"
        base="projectLocation"
        label="Address"
      />

      <mat-form-field appearance="outline">
        <mat-label>Latitude</mat-label>
        <input matInput type="number" step="any" formControlName="projectLatitude" />
        <mat-error>Must be between -90 and 90</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Longitude</mat-label>
        <input matInput type="number" step="any" formControlName="projectLongitude" />
        <mat-error>Must be between -180 and 180</mat-error>
      </mat-form-field>
    </div>
  </app-field-group>

  <app-field-group
    label="Summary cards"
    translated
    help="The small cards under the location. Write a heading for the label and paragraphs underneath; use the toolbar to bold text or change its colour. Three cards fit the row."
  >
    <app-rich-text-card-list
      [cards]="summaryCards()"
      base="projectDescriptionCardContent"
      itemLabel="Card"
      addLabel="Add card"
      placeholder="e.g. Location — Historic centre, Mtskheta"
      (add)="addSummaryCard()"
    />
  </app-field-group>

  <app-field-group
    label="Advantage chips"
    translated
    help="The pill-shaped chips under the summary cards."
  >
    <app-translated-chips
      [group]="form()"
      base="projectAdvantages"
      label="Project advantages"
      placeholder="e.g. 250 m to the sea"
    />
  </app-field-group>

  <app-field-group
    label="Payment note"
    translated
    help="The single line with the card icon, right above the “I'm Interested” button."
  >
    <app-translated-field
      [group]="form()"
      base="paymentDescription"
      label="Payment note"
      multiline
    />
  </app-field-group>
</div>
