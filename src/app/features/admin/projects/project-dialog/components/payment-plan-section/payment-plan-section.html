<div class="project-form__stack">
  <app-field-group
    label="Payment stages"
    translated
    help="One row per stage in the table of the Payment Plan tab. The amount is the same in every language, so it is entered once."
  >
    <div class="project-form__stack">
      @for (plan of paymentPlans().controls; track plan; let i = $index) {
        <div class="project-form__item">
          <div class="project-form__item-header">
            <span>Stage {{ i + 1 }}</span>
            <button
              matIconButton
              type="button"
              aria-label="Remove payment plan"
              (click)="removePaymentPlan(i)"
            >
              <mat-icon>delete_outline</mat-icon>
            </button>
          </div>

          <div class="project-form__grid" [formGroup]="plan">
            <app-translated-field [group]="plan" base="paymentStage" label="Stage" />
            <app-translated-field [group]="plan" base="when" label="When" />

            <mat-form-field appearance="outline" class="project-form__amount">
              <mat-label>Payment amount</mat-label>
              <input matInput type="number" min="0" formControlName="paymentAmount" />
              <span matTextPrefix>$&nbsp;</span>
            </mat-form-field>
          </div>
        </div>
      }

      <button
        matButton="outlined"
        type="button"
        class="project-form__add"
        (click)="addPaymentPlan()"
      >
        <mat-icon>add</mat-icon>
        Add stage
      </button>
    </div>
  </app-field-group>

  <app-field-group
    label="Payment notes"
    translated
    help="The ticked notes highlighted under the payment table."
  >
    <app-translated-chips
      [group]="form()"
      base="paymentAdvantages"
      label="Payment advantages"
      placeholder="e.g. 0% interest instalments"
    />
  </app-field-group>
</div>
