<app-field-group
  label="Apartment types & plans"
  help="Each apartment type becomes an option in the selector at the top of the Floor Plans tab, showing its own plan images."
>
  <div class="project-form__stack">
    @for (plan of apartmentPlans().controls; track plan; let i = $index) {
      <div class="project-form__item">
        <div class="project-form__item-header">
          <span>Apartment type {{ i + 1 }}</span>
          <button
            matIconButton
            type="button"
            aria-label="Remove apartment type"
            (click)="removeApartmentPlan(i)"
          >
            <mat-icon>delete_outline</mat-icon>
          </button>
        </div>

        <div class="project-form__stack" [formGroup]="plan">
          <mat-form-field appearance="outline" class="project-form__full">
            <mat-label>Apartment type</mat-label>
            <input matInput formControlName="apartmentType" placeholder="e.g. Studio" />
          </mat-form-field>

          <app-image-uploader
            label="Plan images"
            [imageIds]="plan.controls.apartmentPlanImages.value"
            (imageIdsChange)="setPlanImages(plan, $event)"
          />

          <app-field-group
            label="Highlight cards"
            translated
            help="The small cards shown beside the plan images of this apartment type. Write a heading for the label and the text under it; use the toolbar to bold text or change its colour."
          >
            <app-rich-text-card-list
              [cards]="plan.controls.apartmentCards"
              base="apartmentCards"
              itemLabel="Card"
              addLabel="Add card"
              placeholder="e.g. Balcony — 5 m² facing the sea"
              (add)="addApartmentCard(plan)"
            />
          </app-field-group>
        </div>
      </div>
    }

    <button
      matButton="outlined"
      type="button"
      class="project-form__add"
      (click)="addApartmentPlan()"
    >
      <mat-icon>add</mat-icon>
      Add apartment type
    </button>
  </div>
</app-field-group>
