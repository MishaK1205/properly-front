<mat-expansion-panel
  [expanded]="expandAll() || expanded()"
  (expandedChange)="expanded.set($event)"
>
  <mat-expansion-panel-header>
    <mat-panel-title>
      <mat-icon class="project-form__panel-icon" aria-hidden="true">trending_up</mat-icon>
      3 · The Numbers — investment breakdown
    </mat-panel-title>
  </mat-expansion-panel-header>

  <p class="project-form__hint">
    The "Investment breakdown at a glance" grid, written as rich text: a heading for the label,
    then the value underneath. Any paragraph after the first is the grey note at the bottom.
  </p>

  <app-rich-text-card-list
    [cards]="investmentCards()"
    controlBase="investmentCard"
    itemLabel="Investment card"
    addLabel="Add investment card"
    placeholder="e.g. Rental yield — 9-11%"
    (add)="addInvestmentCard()"
  />
</mat-expansion-panel>
