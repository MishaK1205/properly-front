<app-field-group
  label="Investment breakdown"
  translated
  help="The “Investment breakdown at a glance” grid. In each card the heading is the label and the text under it is the value; any paragraph after the first becomes the grey note at the bottom."
>
  <app-rich-text-card-list
    [cards]="investmentCards()"
    base="investmentCardContent"
    itemLabel="Card"
    addLabel="Add card"
    placeholder="e.g. Rental yield — 9-11%"
    (add)="addInvestmentCard()"
  />
</app-field-group>
