<div [formGroup]="group()">
  <mat-tab-group dynamicHeight>
    @for (language of languages; track language.suffix) {
      <mat-tab [label]="language.label">
        <div class="project-form__stack project-form__tab-body">
          <app-chip-list-input
            [label]="label() + ' (' + language.label + ')'"
            [placeholder]="placeholder()"
            [formControlName]="controlBase() + language.suffix"
          />
        </div>
      </mat-tab>
    }
  </mat-tab-group>
</div>
