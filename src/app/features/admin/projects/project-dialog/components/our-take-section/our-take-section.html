<div class="project-form__stack">
  <app-field-group
    label="Write-up"
    translated
    help="The body of the “Our Take” section. It opens with its own heading, so start the text with a Heading 2 line."
  >
    <app-translated-rich-text
      [group]="description()"
      base="projectDescription"
      label="Write-up"
      placeholder="Start with a heading, then the body text"
    />
  </app-field-group>

  <app-field-group
    label="Shortlist teaser"
    translated
    help="The sentence or two on the home page shortlist card. It is not part of the Our Take section itself."
  >
    <app-translated-rich-text
      [group]="description()"
      base="projectShortDescription"
      label="Short description"
      placeholder="A sentence or two that sells the property"
    />
  </app-field-group>

  <app-field-group
    label="Verification checklist"
    translated
    help="The ticked list in the grey box beside the write-up."
  >
    <app-translated-chips
      [group]="form()"
      base="verificationChecklist"
      label="Verification checklist"
      placeholder="e.g. Construction permit verified"
    />
  </app-field-group>
</div>
